services:
  caddy:
    hostname: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /srv/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /var/lib/caddy:/var/lib/caddy
      - /var/log/caddy:/var/log/caddy
  agate:
    hostname: agate
    build:
      dockerfile: /srv/agate/Dockerfile
    restart: unless-stopped
    ports:
      - "1965:1965"
    volumes:
      - /var/lib/agate:/var/lib/agate
      - /var/log/agate:/var/log/agate
