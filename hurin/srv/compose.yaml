services:
  caddy:
    hostname: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8008:8008"
      - "8448:8448"
    volumes:
      - /srv/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /var/lib/caddy:/var/lib/caddy
      - /var/log/caddy:/var/log/caddy
  dendrite:
    hostname: dendrite
    image: matrixdotorg/dendrite-monolith:latest
    restart: unless-stopped
    volumes:
      - /srv/dendrite/config:/etc/dendrite
      - /srv/dendrite/cert:/var/lib/dendrite/certs/matrix
      - /var/lib/dendrite/media:/var/lib/dendrite/media
      - /var/lib/dendrite/db:/var/lib/dendrite/db
      - /var/log/dendrite:/var/log/dendrite
