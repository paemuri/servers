version: 2

global:
  server_name: ily-biason.de
  private_key: /var/lib/dendrite/certs/matrix.pem
  key_validity_period: 168h0m0s
  cache:
    max_size_estimated: 1gb
    max_age: 1h
  trusted_third_party_id_servers:
    - matrix.org
    - vector.im
  disable_federation: false
  presence:
    enable_inbound: true
    enable_outbound: true

client_api:
  registration_disabled: true
  guests_disabled: true
  registration_shared_secret: "769PoJ8$W;PCu+fFGmB*TNg*n_f.~>%?"
  rate_limiting:
    enabled: true
    threshold: 20
    cooloff_ms: 500
    exempt_user_ids:
     - "@f:ily-biason.de"
     - "@k:ily-biason.de"

federation_api:
  database:
    connection_string: "file:///var/lib/dendrite/db/federation-api.db"
  send_max_retries: 16
  key_perspectives:
    - server_name: matrix.org
      keys:
        - key_id: ed25519:auto
          public_key: Noi6WqcDj0QmPxCNQqgezwTlBKrfqehY1u2FyWP9uYw
        - key_id: ed25519:a_RXGa
          public_key: l8Hft5qXKn1vfHrg3p4+W8gELQVo8N13JkluMfmn2sQ

media_api:
  database:
    connection_string: "file:///var/lib/dendrite/db/media-api.db"
  base_path: /var/lib/dendrite/media
  max_file_size_bytes: 10485760
  max_thumbnail_generators: 10
  thumbnail_sizes:
    - width: 32
      height: 32
      method: crop
    - width: 96
      height: 96
      method: crop
    - width: 640
      height: 480
      method: scale

key_server:
  database:
    connection_string: "file:///var/lib/dendrite/db/key-server.db"

room_server:
  database:
    connection_string: "file:///var/lib/dendrite/db/room-server.db"

sync_api:
  database:
    connection_string: "file:///var/lib/dendrite/db/sync-api.db"

user_api:
  account_database:
    connection_string: "file:///var/lib/dendrite/db/user-api.db"

relay_api:
  database:
    connection_string: "file:///var/lib/dendrite/db/relay-api.db"

mscs:
  database:
    connection_string: "file:///var/lib/dendrite/db/mscs.db"

logging:
  - type: std
    level: info
    params:
      path: /var/log/dendrite/stdout
  - type: file
    level: info
    params:
      path: /var/log/dendrite/log
